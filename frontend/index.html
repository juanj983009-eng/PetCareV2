<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare Enterprise — En preparación</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7f6;
      color: #17342f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 6vw, 4rem);
      border: 1px solid #d7e2df;
      border-radius: 1rem;
      background: #ffffff;
      box-shadow: 0 1rem 3rem rgb(23 52 47 / 10%);
      text-align: center;
    }

    .status {
      display: inline-block;
      margin-bottom: 1rem;
      padding: .4rem .75rem;
      border-radius: 999px;
      background: #dff5ed;
      color: #17664f;
      font-size: .875rem;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: #526863;
      font-size: clamp(1rem, 3vw, 1.15rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <span class="status">Entorno local activo</span>
    <h1>PetCare Enterprise</h1>
    <p>La plataforma se encuentra en preparación. Este shell técnico confirma que el frontend está disponible.</p>
  </main>
</body>
</html>
