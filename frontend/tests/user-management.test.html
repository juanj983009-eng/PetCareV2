<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HU-007 — Pruebas de usuarios</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    .passed { color: #17664f; }
    .failed { color: #b42318; }
    #fixture { border-top: 1px solid #ccc; margin-top: 2rem; padding-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>HU-007 — Pruebas de usuarios</h1>
    <p id="test-summary" role="status">Ejecutando…</p>
    <ol id="test-results"></ol>
    <div id="fixture">
      <section id="dashboard-home"><button id="users-nav-button" type="button" hidden>Usuarios</button></section>
      <section id="users-view" hidden>
        <h2 id="users-title" tabindex="-1">Usuarios</h2>
        <button id="users-back-button" type="button">Volver</button>
        <button id="new-user-button" type="button" hidden>Nuevo</button>
        <div id="users-notice" tabindex="-1" hidden></div>
        <div id="users-overview" hidden><span id="users-summary-total"></span><span id="users-summary-active"></span><span id="users-summary-inactive"></span><span id="users-summary-branches"></span></div>
        <form id="user-filters">
          <input id="user-search" type="search">
          <select id="user-role-filter"><option value="">Todos</option></select>
          <select id="user-status-filter"><option value="">Todos</option><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option><option value="BLOQUEADO">Bloqueado</option></select>
          <select id="user-sort"><option value="firstName">Nombre</option></select>
          <select id="user-direction"><option value="asc">Ascendente</option></select>
          <button type="submit">Aplicar</button><button id="clear-user-filters" type="button">Limpiar</button>
          <button type="button" data-user-status="" aria-pressed="true">Todos</button><button type="button" data-user-status="ACTIVO" aria-pressed="false">Activos</button><button type="button" data-user-status="INACTIVO" aria-pressed="false">Inactivos</button>
        </form>
        <div id="users-loading" hidden></div><div id="users-empty" hidden></div>
        <div id="users-error" hidden><p id="users-error-message"></p><p id="users-error-correlation" hidden></p><button id="retry-users-list" type="button">Reintentar</button></div>
        <div id="users-content" hidden><table><tbody id="users-table-body"></tbody></table><div id="users-cards"></div></div>
        <button id="users-previous-page" type="button">Anterior</button>
        <button id="users-next-page" type="button">Siguiente</button><p id="users-page-status"></p>
      </section>
      <dialog id="user-editor-dialog">
        <h2 id="user-editor-title"></h2><div id="user-form-errors"></div>
        <form id="user-form" novalidate>
          <input id="user-version" type="hidden">
          <input id="user-first-name" name="firstName" required>
          <input id="user-last-name" name="lastName" required>
          <input id="user-email" name="email" type="email" required>
          <div id="user-password-group"><input id="user-initial-password" name="initialPassword" minlength="12" required></div>
          <select id="user-role" name="roleId" required><option value="">Rol</option></select>
          <select id="user-branch" name="branchId" required><option value="">Sede</option></select>
          <button id="cancel-user-button" type="button">Cancelar</button><button id="save-user-button" type="submit">Guardar</button>
        </form>
      </dialog>
      <dialog id="user-status-dialog"><h2 id="user-status-title"></h2><p id="user-status-message"></p>
        <button id="cancel-user-status" type="button">Cancelar</button><button id="confirm-user-status" type="button">Confirmar</button>
      </dialog>
    </div>
  </main>
  <script type="module" src="./user-management.test.js"></script>
</body>
</html>
