<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HU-006 — Pruebas de sesión</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    .passed { color: #17664f; }
    .failed { color: #b42318; }
    #fixture { border-top: 1px solid #ccc; margin-top: 2rem; padding-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>HU-006 — Pruebas de sesión</h1>
    <p id="test-summary" role="status">Ejecutando…</p>
    <ol id="test-results"></ol>

    <div id="fixture">
      <section id="login-view" hidden>
        <div id="login-errors"></div>
        <form id="login-form" novalidate>
          <label for="clinicSlug">Clínica</label>
          <input id="clinicSlug" name="clinicSlug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required>
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" required>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required>
          <button id="login-button" type="submit">
            <span id="login-button-label">Iniciar sesión</span>
            <span id="login-spinner" hidden></span>
          </button>
        </form>
      </section>

      <section id="session-validation-view" hidden>
        <h2 id="session-validation-title" tabindex="-1">Validando tu sesión</h2>
      </section>

      <section id="session-validation-error-view" hidden>
        <h2>No pudimos validar tu sesión</h2>
        <p id="session-validation-error-message"></p>
        <p id="session-validation-correlation" hidden></p>
        <button id="retry-session-button" type="button">Reintentar validación</button>
      </section>

      <section id="dashboard-view" hidden>
        <h2 id="dashboard-title" tabindex="-1">Dashboard inicial</h2>
        <div id="authority-list"></div>
        <button id="logout-button" type="button">Cerrar sesión</button>
      </section>
    </div>
  </main>
  <script type="module" src="./auth-session.test.js"></script>
</body>
</html>
