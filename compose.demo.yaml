name: petcare-demo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - demo_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PETCARE_JWT_SECRET: ${PETCARE_JWT_SECRET}
      PETCARE_JWT_ISSUER: ${PETCARE_JWT_ISSUER:-https://petcare.demo.local}
      PETCARE_JWT_ACCESS_TOKEN_TTL: ${PETCARE_JWT_ACCESS_TOKEN_TTL:-PT15M}
      PETCARE_BOOTSTRAP_ENABLED: ${PETCARE_BOOTSTRAP_ENABLED}
      PETCARE_BOOTSTRAP_TENANT_NAME: ${PETCARE_BOOTSTRAP_TENANT_NAME}
      PETCARE_BOOTSTRAP_TENANT_SLUG: ${PETCARE_BOOTSTRAP_TENANT_SLUG}
      PETCARE_BOOTSTRAP_TENANT_PLAN: ${PETCARE_BOOTSTRAP_TENANT_PLAN:-STARTER}
      PETCARE_BOOTSTRAP_BRANCH_NAME: ${PETCARE_BOOTSTRAP_BRANCH_NAME}
      PETCARE_BOOTSTRAP_BRANCH_TIME_ZONE: ${PETCARE_BOOTSTRAP_BRANCH_TIME_ZONE:-America/Lima}
      PETCARE_BOOTSTRAP_ADMIN_FIRST_NAME: ${PETCARE_BOOTSTRAP_ADMIN_FIRST_NAME}
      PETCARE_BOOTSTRAP_ADMIN_LAST_NAME: ${PETCARE_BOOTSTRAP_ADMIN_LAST_NAME}
      PETCARE_BOOTSTRAP_ADMIN_EMAIL: ${PETCARE_BOOTSTRAP_ADMIN_EMAIL}
      PETCARE_BOOTSTRAP_ADMIN_PASSWORD: ${PETCARE_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app, data]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-18081}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [app]
    restart: unless-stopped

volumes:
  demo_postgres_data:
    name: petcare_demo_postgres_data

networks:
  app:
  data:
    internal: true
